name: Render Manim Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Manim
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config
          pip install manim

      - name: Render Magnetic Field
        run: |
          manim -pqh magnetic_field_no_work.py MagneticFieldNoWork

      - name: Render Universe Expansion
        run: |
          manim -pqh universe_expansion_faster_than_light.py UniverseExpansion

      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: manim-videos
          path: media/videos/
